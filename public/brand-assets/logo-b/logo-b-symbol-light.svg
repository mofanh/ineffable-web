<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Logo B: 道·交汇 - 浅色模式 -->
  <title>Ineffable Logo B - 道·交汇</title>
  <desc>万物生于有，有生于无。交汇即智慧，连接即意义。</desc>
  
  <g fill="none" stroke="#1a1a1a">
    <!-- 两条路径 -->
    <path d="M15 20 Q 35 42, 40 40" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M65 60 Q 45 42, 40 40" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 交汇点 -->
    <circle cx="40" cy="40" r="3" fill="#1a1a1a" stroke="none"/>
    <!-- 扩散环 -->
    <circle cx="40" cy="40" r="10" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>