<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 30">
  <!-- Logo A: 道·路径 - 横向组合 浅色模式 -->
  <title>Ineffable Logo A - 道·路径</title>
  <desc>Symbol + Wordmark 横向组合</desc>
  
  <!-- Symbol -->
  <g transform="translate(0, 6)">
    <circle cx="4" cy="9" r="1.5" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M6 9 Q 15 9, 24 6 T 42 3" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="44" cy="2" r="1" fill="#1a1a1a"/>
    <text x="48" y="5" font-size="6" fill="#888" font-family="monospace">···</text>
  </g>
  
  <!-- Wordmark -->
  <text x="6" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="500" fill="#1a1a1a" letter-spacing="1.5">INEFFABLE</text>
</svg>
