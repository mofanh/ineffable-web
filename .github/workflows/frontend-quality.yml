name: Frontend Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for behavior checks
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          echo "CHROME_PATH=$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Authentication session boundaries
        run: |
          npm run check:auth-session
          npm run check:auth-isolation
          npm run check:password-change
          npm run check:api-resource

      - name: Owned channel recovery experience
        run: npm run check:channels

      - name: Internationalization
        run: npm run i18n:check

      - name: Chat architecture
        run: npm run check:chat-architecture

      - name: Chat web runtime
        run: npm run check:chat-web-runtime

      - name: Chat web integration
        run: npm run check:chat-web-integration

      - name: Chat browser
        run: npm run check:chat-browser

      - name: Long conversation windows and input ownership
        run: |
          npm run check:chat-window
          npm run check:input-progress
          npm run check:run-observations

      - name: Image attachments and delayed send
        run: npm run check:images

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_GATEWAY_API_BASE_URL: ""
        run: npm run build
