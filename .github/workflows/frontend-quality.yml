name: Frontend Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chat architecture
        run: npm run check:chat-architecture

      - name: Chat web runtime
        run: npm run check:chat-web-runtime

      - name: Chat web integration
        run: npm run check:chat-web-integration

      - name: Chat browser
        run: npm run check:chat-browser

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_GATEWAY_API_BASE_URL: ""
        run: npm run build
